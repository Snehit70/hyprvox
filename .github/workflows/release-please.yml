name: release-please

on:
  workflow_dispatch: # Manual trigger only — auto-trigger disabled because
    # GITHUB_TOKEN cannot create PRs (repo setting:
    # "Allow GitHub Actions to create and approve pull requests" is off).
    # To re-enable: go to Settings → Actions → General → enable that checkbox,
    # or add a PAT as the RELEASE_PLEASE_TOKEN secret.

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: false
          skip-github-release: true
