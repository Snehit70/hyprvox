name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Pack package
        run: bun x npm pack

      - name: Smoke test Bun global install
        run: |
          PACKAGE_TGZ=$(ls hyprvox-*.tgz)
          bun add -g "$PWD/$PACKAGE_TGZ"
          hyprvox --help
