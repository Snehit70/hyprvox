name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Pack package
        run: bun x npm pack

      - name: Smoke test Bun global install
        run: |
          PACKAGE_TGZ=$(ls hyprvox-*.tgz)
          bun add -g "$PWD/$PACKAGE_TGZ"
          hyprvox --help

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Tag version v${{ steps.version.outputs.VERSION }} does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
      
      - name: Publish package to npm
        run: npm publish --access public

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT

          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          FEATS=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* feat" || true)
          FIXES=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* fix" || true)
          CHORES=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* \(chore\|docs\|ci\|refactor\)" || true)

          if [ -n "$FEATS" ]; then
            echo "### Features" >> $GITHUB_OUTPUT
            echo "$FEATS" | sed 's/^[a-f0-9]* feat[^:]*: /- /' >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FIXES" ]; then
            echo "### Bug Fixes" >> $GITHUB_OUTPUT
            echo "$FIXES" | sed 's/^[a-f0-9]* fix[^:]*: /- /' >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          if [ -n "$CHORES" ]; then
            echo "### Other" >> $GITHUB_OUTPUT
            echo "$CHORES" | sed 's/^[a-f0-9]* [^:]*: /- /' >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          echo "**Full changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: hyprvox ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
